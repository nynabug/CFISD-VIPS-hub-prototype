<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VIPS Hub - Admin Dashboard</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="VIPS Hub - Admin Dashboard">
  <meta name="theme-color" content="#167c80">

  <link rel="apple-touch-icon" sizes="180x180" href="https://nynabug.github.io/CFISD-VIPS-hub-prototype/apple-touch-icon.png?v=3">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://nynabug.github.io/CFISD-VIPS-hub-prototype/apple-touch-icon.png?v=3">
  <link rel="icon" type="image/png" sizes="180x180" href="https://nynabug.github.io/CFISD-VIPS-hub-prototype/apple-touch-icon.png?v=3">

  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #16858a, #5c3f86);
      color: white;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      width: min(430px, 100%);
      box-sizing: border-box;
      padding: 32px 26px;
      border-radius: 28px;
      background: rgba(255,255,255,.14);
      box-shadow: 0 18px 55px rgba(0,0,0,.16);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .owl {
      font-size: 64px;
      line-height: 1;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; line-height: 1.45; opacity: .92; }
    a {
      display: block;
      padding: 15px 20px;
      border-radius: 14px;
      background: white;
      color: #176f73;
      text-decoration: none;
      font-weight: 800;
      font-size: 17px;
    }
    .hint {
      margin-top: 20px;
      font-size: 13px;
      opacity: .78;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="owl" aria-hidden="true">🦉</div>
    <h1>McGown VIPS Hub Admin</h1>
    <p>Secure access to the VIPS Hub Admin Dashboard.</p>
    <a href="https://script.google.com/macros/s/AKfycby8VFBAOfZDR26PcAOebALA87POhxKY0M56iUyL543hBz3HMWsmRgXW6eqW0FkUST8rmw/exec?admin=1">Open Admin Dashboard</a>
    <div class="hint">Add this launcher page to your Home Screen for quick access.</div>
  </main>
</body>
</html>
